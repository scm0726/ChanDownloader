              private val mediaRegex = Regex("""\.(mp4|m3u8|webm|m4a|mp3|mov|mpd)(\?|#|$)""", RegexOption.IGNORE_CASE)

              // ==================================================================
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(buildUi())

                  if (Build.VERSION.SDK_INT >= 33 &&
                      ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 10)

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          when {
                              currentTab == TAB_BROWSER && homeView.visibility != View.VISIBLE && webView.canGoBack() -> webView.goBack()
                              currentTab == TAB_BROWSER && homeView.visibility != View.VISIBLE -> showHome()
                              currentTab != TAB_BROWSER -> selectTab(TAB_BROWSER)
                              else -> { isEnabled = false; onBackPressedDispatcher.onBackPressed() }
                          }
                      }
