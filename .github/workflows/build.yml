              // 다운로드 목록
              private fun renderList(list: List<Task>) {
                  listBox.removeAllViews()
                  emptyText.visibility = if (list.isEmpty()) View.VISIBLE else View.GONE
                  val active = list.count { it.active }
                  tabButtons[TAB_FILES].text = if (active > 0) "⬇ 다운로드 ($active)" else "⬇ 다운로드"
                  for (t in list) listBox.addView(taskView(t))
              }

              private fun taskView(t: Task): View {
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(14), dp(12), dp(14), dp(12))
                      background = rounded(Color.parseColor("#122563EB"), 12)
                  }
                  card.addView(TextView(this).apply {
                      text = (when (t.status) {
                          Status.DONE -> if (t.mime?.startsWith("audio") == true) "🎵 " else "🎬 "
                          Status.FAILED -> "⚠ "
                          Status.CANCELED -> "✕ "
                          else -> "⬇ "
                      }) + t.title
                      textSize = 15f
                      maxLines = 2
                      ellipsize = TextUtils.TruncateAt.END
                      setTypeface(typeface, Typeface.BOLD)
                  })
                  val sub = buildString {
                      append(t.option)
                      if (t.status == Status.DONE) {
                          append(" · ").append(humanSize(t.size))
                          append(" · ").append(SimpleDateFormat("M/d HH:mm", Locale.KOREA).format(Date(t.time)))
                      } else append(" · ").append(t.message)
                  }
                  card.addView(TextView(this).apply {
                      text = sub
                      textSize = 12f
                      setTextColor(if (t.status == Status.FAILED) Color.parseColor("#DC2626") else gray)
                      maxLines = 3
                      ellipsize = TextUtils.TruncateAt.END
                      setPadding(0, dp(3), 0, 0)
                  })
                  if (t.active) {
                      card.addView(ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply {
                          max = 100
                          isIndeterminate = t.progress < 0
                          if (t.progress >= 0) progress = t.progress
                      }, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply { topMargin = dp(6) })
                  }

                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.END
                      setPadding(0, dp(6), 0, 0)
                  }
                  fun act(label: String, onClick: () -> Unit) {
                      row.addView(TextView(this).apply {
                          text = label
                          textSize = 14f
                          setTextColor(blue)
                          setPadding(dp(12), dp(6), dp(12), dp(6))
                          setOnClickListener { onClick() }
                      })
                  }
                  when (t.status) {
                      Status.QUEUED, Status.RUNNING -> act("취소") { DownloadManager.cancel(t.id) }
                      Status.DONE -> {
                          act("열기") { openFile(t) }
                          act("공유") { shareFile(t) }
                          act("삭제") { confirmDelete(t) }
                      }
                      Status.FAILED, Status.CANCELED -> {
                          act("다시 받기") { DownloadManager.retry(this, t) }
                          act("링크 복사") { copyText(t.url) }
                          act("삭제") { DownloadManager.remove(t.id, false) }
                      }
                  }
                  card.addView(row)
                  if (t.status == Status.DONE) card.setOnClickListener { openFile(t) }

                  return card.apply {
                      layoutParams = LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply { bottomMargin = dp(10) }
                  }
              }

              private fun openFile(t: Task) {
                  val uri = t.uri ?: return
                  runCatching {
                      startActivity(Intent(Intent.ACTION_VIEW).setDataAndType(Uri.parse(uri), t.mime ?: "*/*")
                          .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION))
                  }.onFailure { Toast.makeText(this, "열 수 있는 앱이 없거나 파일이 지워졌어요", Toast.LENGTH_SHORT).show() }
              }

              private fun shareFile(t: Task) {
                  val uri = t.uri ?: return
                  val i = Intent(Intent.ACTION_SEND).setType(t.mime ?: "*/*")
                      .putExtra(Intent.EXTRA_STREAM, Uri.parse(uri))
                      .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  startActivity(Intent.createChooser(i, "공유"))
              }

              private fun confirmDelete(t: Task) {
                  AlertDialog.Builder(this)
                      .setTitle("삭제")
                      .setMessage(t.title)
                      .setPositiveButton("파일까지 삭제") { _, _ -> DownloadManager.remove(t.id, true) }
                      .setNeutralButton("기록만 삭제") { _, _ -> DownloadManager.remove(t.id, false) }
                      .setNegativeButton("취소", null)
                      .show()
              }

              private fun copyText(s: String) {
                  val cm = getSystemService(ClipboardManager::class.java)
                  cm.setPrimaryClip(android.content.ClipData.newPlainText("url", s))
                  getSharedPreferences("app", Context.MODE_PRIVATE).edit().putString("lastClip", s).apply()
                  Toast.makeText(this, "복사했어요", Toast.LENGTH_SHORT).show()
              }

              private fun humanSize(b: Long): String = when {
                  b >= 1L shl 30 -> "%.2f GB".format(b / (1L shl 30).toDouble())
                  b >= 1L shl 20 -> "%.1f MB".format(b / (1L shl 20).toDouble())
                  b >= 1L shl 10 -> "%.0f KB".format(b / 1024.0)
                  else -> "$b B"
              }

              // ==================================================================
              // yt-dlp 업데이트
              private fun updateYtDlp(after: (() -> Unit)? = null) {
                  updateBtn.isEnabled = false
                  updateBtn.text = "업데이트 중..."
                  lifecycleScope.launch {
                      val msg = withContext(Dispatchers.IO) {
                          runCatching {
                              App.initJob.await().getOrThrow()
                              val st = YoutubeDL.getInstance().updateYoutubeDL(applicationContext)
                              val ver = YoutubeDL.getInstance().versionName(applicationContext) ?: "?"
                              if (st == YoutubeDL.UpdateStatus.DONE) "yt-dlp 업데이트 완료 ($ver)" else "이미 최신이에요 ($ver)"
                          }.getOrElse { "업데이트 실패: ${it.message}" }
                      }
                      Toast.makeText(this@MainActivity, msg, Toast.LENGTH_LONG).show()
                      if (!msg.startsWith("업데이트 실패")) {
                          getSharedPreferences("app", Context.MODE_PRIVATE).edit()
                              .putLong("ytdlpUpdated", System.currentTimeMillis()).apply()
                      }
                      after?.invoke()
                      updateBtn.isEnabled = true
                      updateBtn.text = "yt-dlp 업데이트 (다운로드가 안 될 때)"
                  }
              }

