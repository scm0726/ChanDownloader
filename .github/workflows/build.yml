              }

              override fun onPause() { super.onPause(); webView.onPause(); CookieManager.getInstance().flush() }
              override fun onResume() { super.onResume(); webView.onResume() }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) checkClipboard()
              }

              // ==================================================================
              // 공유 / 클립보드
              private fun handleShare(intent: Intent?) {
                  if (intent?.action != Intent.ACTION_SEND) return
                  val text = intent.getStringExtra(Intent.EXTRA_TEXT) ?: return
                  val url = extractUrl(text) ?: return
                  intent.action = null
                  urlInput.setText(url)
                  selectTab(TAB_LINK)
                  showFormatPicker(url, null, null)
              }

              private fun checkClipboard() {
                  val cm = getSystemService(ClipboardManager::class.java) ?: return
                  val text = runCatching { cm.primaryClip?.getItemAt(0)?.coerceToText(this)?.toString() }.getOrNull() ?: return
                  val url = extractUrl(text) ?: return
                  val prefs = getSharedPreferences("app", Context.MODE_PRIVATE)
                  if (prefs.getString("lastClip", null) == url) return
                  prefs.edit().putString("lastClip", url).apply()
                  AlertDialog.Builder(this)
                      .setTitle("복사한 링크를 받을까요?")
                      .setMessage(url)
                      .setPositiveButton("화질 선택") { _, _ -> urlInput.setText(url); showFormatPicker(url, null, null) }
                      .setNeutralButton("브라우저로 열기") { _, _ -> selectTab(TAB_BROWSER); loadUrl(url) }
                      .setNegativeButton("무시", null)
                      .show()
              }

              private fun extractUrl(text: String): String? =
                  Regex("""https?://\S+""").find(text)?.value?.trimEnd('.', ',', ')', ']', '"', '\'')

              // ==================================================================
              // 화질 선택
              private fun showFormatPicker(url: String, referer: String?, titleHint: String?) {
                  val loading = AlertDialog.Builder(this)
                      .setTitle("영상 분석 중...")
                      .setMessage("잠시만 기다려 주세요.\n$url")
                      .setCancelable(true)
                      .show()

                  lifecycleScope.launch {
                      val result = withContext(Dispatchers.IO) {
                          runCatching {
                              App.initJob.await().getOrThrow()
                              val req = YoutubeDLRequest(url).apply {
                                  addOption("--no-playlist")
                                  if (referer != null) addOption("--referer", referer)
                              }
                              YoutubeDL.getInstance().getInfo(req)
                          }
                      }
                      if (!loading.isShowing) return@launch
                      loading.dismiss()

                      val info = result.getOrNull()
                      val title = info?.title ?: titleHint ?: url
                      val options = ArrayList<DlOption>()
                      options += DownloadManager.BEST_VIDEO
                      info?.formats
                          ?.filter { it.height > 0 && it.vcodec != null && it.vcodec != "none" }
                          ?.map { it.height }
                          ?.distinct()
                          ?.sortedDescending()
                          ?.forEach { h -> options += DownloadManager.heightOption(h) }
                      options += DownloadManager.MP3
                      options += DownloadManager.M4A

                      val labels = options.map { opt ->
                          if (opt === DownloadManager.BEST_VIDEO) "⭐ ${opt.label} (추천)" else opt.label
                      }.toTypedArray<CharSequence>()

                      val dur = info?.duration ?: 0
                      val subtitle = buildString {
                          if (dur > 0) append("길이 ${dur / 60}:${"%02d".format(dur % 60)}  ")
                          info?.extractorKey?.let { append("· $it") }
                          if (info == null) {
                              append("⚠ 분석 실패 — 그래도 받아볼 수 있어요\n")
                              append(result.exceptionOrNull()?.message?.lines()?.lastOrNull { it.isNotBlank() }?.take(150) ?: "")
                          }
                      }
                      if (subtitle.isNotBlank()) Toast.makeText(this@MainActivity, subtitle, Toast.LENGTH_LONG).show()

                      AlertDialog.Builder(this@MainActivity)
                          .setTitle(title)
                          .setItems(labels) { _, which ->
                              DownloadManager.enqueue(this@MainActivity, url, title, options[which], referer)
                              Toast.makeText(this@MainActivity, "다운로드를 시작했어요", Toast.LENGTH_SHORT).show()
                              selectTab(TAB_FILES)
                          }
                          .setNegativeButton("취소", null)
                          .show()
                  }
              }

              // ==================================================================
              // 브라우저
              private fun loadUrl(input: String) {
                  val t = input.trim()
                  if (t.isEmpty()) return
                  val url = when {
                      t.startsWith("http://") || t.startsWith("https://") -> t
                      t.contains(".") && !t.contains(" ") -> "https://$t"
                      else -> "https://www.google.com/search?q=" + Uri.encode(t)
                  }
                  homeView.visibility = View.GONE
                  webView.visibility = View.VISIBLE
                  webView.loadUrl(url)
                  hideKeyboard()
              }

              private fun showHome() {
                  homeView.visibility = View.VISIBLE
                  webView.visibility = View.INVISIBLE
                  addressBar.setText("")
                  synchronized(detected) { detected.clear() }
                  updateFab()
              }

              private fun updateFab() {
                  val n = synchronized(detected) { detected.size }
                  fab.text = if (n > 0) "⬇  다운로드 · 영상 ${n}개 감지" else "⬇  이 페이지 다운로드"
                  fab.visibility = if (homeView.visibility == View.VISIBLE) View.GONE else View.VISIBLE
              }

              private fun onFabClick() {
                  val pageUrl = webView.url ?: return
                  val pageTitle = webView.title
                  val media = synchronized(detected) { detected.toList() }.reversed()
                  if (media.isEmpty()) {
                      showFormatPicker(pageUrl, null, pageTitle)
                      return
                  }
                  val items = (listOf("🔍 이 페이지 분석해서 받기 (추천)") +
                      media.map { "🎬 " + it.substringBefore("?").substringAfterLast("/").ifBlank { it }.take(60) })
                      .toTypedArray<CharSequence>()
                  AlertDialog.Builder(this)
                      .setTitle("무엇을 받을까요?")
                      .setItems(items) { _, which ->
                          if (which == 0) showFormatPicker(pageUrl, null, pageTitle)
                          else {
                              DownloadManager.enqueue(this, media[which - 1], pageTitle, DownloadManager.BEST_VIDEO, pageUrl)
                              Toast.makeText(this, "다운로드를 시작했어요", Toast.LENGTH_SHORT).show()
                              selectTab(TAB_FILES)
                          }
                      }
                      .setNegativeButton("취소", null)
                      .show()
              }

              @SuppressLint("SetJavaScriptEnabled")
              private fun setupWebView(w: WebView) {
                  w.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      loadWithOverviewMode = true
                      useWideViewPort = true
                      setSupportZoom(true)
                      builtInZoomControls = true
                      displayZoomControls = false
                      mediaPlaybackRequiresUserGesture = true
                  }
                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(w, true)

                  w.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                          val s = request.url.scheme ?: return false
                          if (s == "http" || s == "https") return false
                          // intent://, 앱 링크 등은 무시 (앱으로 튕겨나가지 않게)
                          return true
                      }

                      override fun onPageStarted(view: WebView, url: String, favicon: Bitmap?) {
                          addressBar.setText(url)
                          synchronized(detected) { detected.clear() }
                          updateFab()
                      }

                      override fun shouldInterceptRequest(view: WebView, request: WebResourceRequest): WebResourceResponse? {
                          val u = request.url.toString()
                          if (mediaRegex.containsMatchIn(u.substringBefore("?") + "?") || mediaRegex.containsMatchIn(u)) {
                              val added = synchronized(detected) { detected.add(u) }
                              if (added) runOnUiThread { updateFab() }
                          }
                          return null
                      }
                  }
                  w.webChromeClient = object : WebChromeClient() {
                      override fun onProgressChanged(view: WebView, newProgress: Int) {
                          pageProgress.progress = newProgress
                          pageProgress.visibility = if (newProgress in 1..99) View.VISIBLE else View.INVISIBLE
                      }
                  }
              }

              // ==================================================================
              // 다운로드 목록
              private fun renderList(list: List<Task>) {
                  listBox.removeAllViews()
                  emptyText.visibility = if (list.isEmpty()) View.VISIBLE else View.GONE
                  val active = list.count { it.active }
                  tabButtons[TAB_FILES].text = if (active > 0) "⬇ 다운로드 ($active)" else "⬇ 다운로드"
                  for (t in list) listBox.addView(taskView(t))
              }

              private fun taskView(t: Task): View {
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(14), dp(12), dp(14), dp(12))
                      background = rounded(Color.parseColor("#122563EB"), 12)
                  }
                  card.addView(TextView(this).apply {
                      text = (when (t.status) {
                          Status.DONE -> if (t.mime?.startsWith("audio") == true) "🎵 " else "🎬 "
                          Status.FAILED -> "⚠ "
                          Status.CANCELED -> "✕ "
                          else -> "⬇ "
                      }) + t.title
                      textSize = 15f
                      maxLines = 2
                      ellipsize = TextUtils.TruncateAt.END
                      setTypeface(typeface, Typeface.BOLD)
                  })
                  val sub = buildString {
                      append(t.option)
                      if (t.status == Status.DONE) {
                          append(" · ").append(humanSize(t.size))
                          append(" · ").append(SimpleDateFormat("M/d HH:mm", Locale.KOREA).format(Date(t.time)))
                      } else append(" · ").append(t.message)
                  }
                  card.addView(TextView(this).apply {
                      text = sub
                      textSize = 12f
                      setTextColor(if (t.status == Status.FAILED) Color.parseColor("#DC2626") else gray)
                      maxLines = 3
                      ellipsize = TextUtils.TruncateAt.END
                      setPadding(0, dp(3), 0, 0)
                  })
                  if (t.active) {
                      card.addView(ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply {
                          max = 100
                          isIndeterminate = t.progress < 0
                          if (t.progress >= 0) progress = t.progress
                      }, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply { topMargin = dp(6) })
                  }

                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.END
                      setPadding(0, dp(6), 0, 0)
                  }
                  fun act(label: String, onClick: () -> Unit) {
                      row.addView(TextView(this).apply {
                          text = label
                          textSize = 14f
                          setTextColor(blue)
                          setPadding(dp(12), dp(6), dp(12), dp(6))
                          setOnClickListener { onClick() }
                      })
                  }
                  when (t.status) {
                      Status.QUEUED, Status.RUNNING -> act("취소") { DownloadManager.cancel(t.id) }
                      Status.DONE -> {
                          act("열기") { openFile(t) }
                          act("공유") { shareFile(t) }
                          act("삭제") { confirmDelete(t) }
                      }
                      Status.FAILED, Status.CANCELED -> {
                          act("다시 받기") { DownloadManager.retry(this, t) }
                          act("링크 복사") { copyText(t.url) }
                          act("삭제") { DownloadManager.remove(t.id, false) }
                      }
                  }
                  card.addView(row)
                  if (t.status == Status.DONE) card.setOnClickListener { openFile(t) }

                  return card.apply {
                      layoutParams = LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply { bottomMargin = dp(10) }
                  }
              }

              private fun openFile(t: Task) {
                  val uri = t.uri ?: return
                  runCatching {
                      startActivity(Intent(Intent.ACTION_VIEW).setDataAndType(Uri.parse(uri), t.mime ?: "*/*")
                          .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION))
                  }.onFailure { Toast.makeText(this, "열 수 있는 앱이 없거나 파일이 지워졌어요", Toast.LENGTH_SHORT).show() }
              }

              private fun shareFile(t: Task) {
                  val uri = t.uri ?: return
                  val i = Intent(Intent.ACTION_SEND).setType(t.mime ?: "*/*")
                      .putExtra(Intent.EXTRA_STREAM, Uri.parse(uri))
                      .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  startActivity(Intent.createChooser(i, "공유"))
              }

              private fun confirmDelete(t: Task) {
                  AlertDialog.Builder(this)
                      .setTitle("삭제")
                      .setMessage(t.title)
                      .setPositiveButton("파일까지 삭제") { _, _ -> DownloadManager.remove(t.id, true) }
                      .setNeutralButton("기록만 삭제") { _, _ -> DownloadManager.remove(t.id, false) }
                      .setNegativeButton("취소", null)
                      .show()
              }

              private fun copyText(s: String) {
                  val cm = getSystemService(ClipboardManager::class.java)
                  cm.setPrimaryClip(android.content.ClipData.newPlainText("url", s))
                  getSharedPreferences("app", Context.MODE_PRIVATE).edit().putString("lastClip", s).apply()
                  Toast.makeText(this, "복사했어요", Toast.LENGTH_SHORT).show()
              }

              private fun humanSize(b: Long): String = when {
                  b >= 1L shl 30 -> "%.2f GB".format(b / (1L shl 30).toDouble())
                  b >= 1L shl 20 -> "%.1f MB".format(b / (1L shl 20).toDouble())
                  b >= 1L shl 10 -> "%.0f KB".format(b / 1024.0)
                  else -> "$b B"
              }

              // ==================================================================
              // yt-dlp 업데이트
              private fun updateYtDlp() {
                  updateBtn.isEnabled = false
                  updateBtn.text = "업데이트 중..."
                  lifecycleScope.launch {
                      val msg = withContext(Dispatchers.IO) {
                          runCatching {
                              App.initJob.await().getOrThrow()
                              val st = YoutubeDL.getInstance().updateYoutubeDL(applicationContext)
                              val ver = YoutubeDL.getInstance().versionName(applicationContext) ?: "?"
                              if (st == YoutubeDL.UpdateStatus.DONE) "yt-dlp 업데이트 완료 ($ver)" else "이미 최신이에요 ($ver)"
                          }.getOrElse { "업데이트 실패: ${it.message}" }
                      }
                      Toast.makeText(this@MainActivity, msg, Toast.LENGTH_LONG).show()
                      updateBtn.isEnabled = true
                      updateBtn.text = "yt-dlp 업데이트 (다운로드가 안 될 때)"
                  }
              }

              // ==================================================================
              // UI 헬퍼
              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun rounded(color: Int, radius: Int = 14, stroke: Int? = null) = GradientDrawable().apply {
                  setColor(color); cornerRadius = dp(radius).toFloat()
                  if (stroke != null) setStroke(dp(1), stroke)
              }

              private fun button(text: String, primary: Boolean, onClick: () -> Unit) = Button(this).apply {
                  this.text = text
                  isAllCaps = false
                  textSize = if (primary) 16f else 14f
                  setTextColor(if (primary) Color.WHITE else blue)
                  background = if (primary) rounded(blue) else rounded(Color.TRANSPARENT, stroke = blue)
                  stateListAnimator = null
                  setOnClickListener { onClick() }
              }

              private fun hideKeyboard() {
                  getSystemService(InputMethodManager::class.java)?.hideSoftInputFromWindow(window.decorView.windowToken, 0)
              }

              private fun selectTab(i: Int) {
                  currentTab = i
                  pages.forEachIndexed { idx, v -> v.visibility = if (idx == i) View.VISIBLE else View.GONE }
                  tabButtons.forEachIndexed { idx, b ->
                      b.setTextColor(if (idx == i) blue else gray)
                      b.setTypeface(null, if (idx == i) Typeface.BOLD else Typeface.NORMAL)
                  }
                  hideKeyboard()
              }

              // ==================================================================
              // 화면 구성
              private fun buildUi(): View {
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  val content = FrameLayout(this)
                  root.addView(content, LinearLayout.LayoutParams(MATCH_PARENT, 0, 1f))

                  val browserPage = buildBrowserPage()
                  val linkPage = buildLinkPage()
                  val filesPage = buildFilesPage()
                  pages = listOf(browserPage, linkPage, filesPage)
                  pages.forEach { content.addView(it, FrameLayout.LayoutParams(MATCH_PARENT, MATCH_PARENT)) }

                  // 하단 탭
                  root.addView(View(this).apply { setBackgroundColor(Color.parseColor("#22888888")) }, LinearLayout.LayoutParams(MATCH_PARENT, dp(1)))
                  val nav = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  tabButtons = listOf("🌐 브라우저", "🔗 링크", "⬇ 다운로드").mapIndexed { idx, label ->
                      TextView(this).apply {
                          text = label
                          gravity = Gravity.CENTER
                          textSize = 14f
                          setPadding(0, dp(14), 0, dp(14))
                          setOnClickListener { selectTab(idx) }
                      }.also { nav.addView(it, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f)) }
                  }
                  root.addView(nav)
                  return root
              }

              private fun buildBrowserPage(): View {
                  val page = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }

                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(8), dp(8), dp(8), dp(6))
                  }
                  bar.addView(TextView(this).apply {
                      text = "⌂"
                      textSize = 22f
                      setTextColor(blue)
                      setPadding(dp(8), 0, dp(10), 0)
                      setOnClickListener { showHome() }
                  })
                  addressBar = EditText(this).apply {
                      hint = "주소 또는 검색어"
                      textSize = 14f
                      isSingleLine = true
                      imeOptions = EditorInfo.IME_ACTION_GO
                      setSelectAllOnFocus(true)
                      setPadding(dp(12), dp(8), dp(12), dp(8))
                      background = rounded(Color.parseColor("#1A2563EB"), 20)
                      setOnEditorActionListener { v, actionId, event ->
                          if (actionId == EditorInfo.IME_ACTION_GO ||
                              (event?.keyCode == KeyEvent.KEYCODE_ENTER && event.action == KeyEvent.ACTION_DOWN)
                          ) { loadUrl(v.text.toString()); true } else false
                      }
                  }
                  bar.addView(addressBar, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))
                  bar.addView(TextView(this).apply {
                      text = "↻"
                      textSize = 20f
                      setTextColor(blue)
                      setPadding(dp(12), 0, dp(6), 0)
                      setOnClickListener { if (homeView.visibility != View.VISIBLE) webView.reload() }
                  })
                  page.addView(bar)

                  pageProgress = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply {
                      max = 100
                      visibility = View.INVISIBLE
                  }
                  page.addView(pageProgress, LinearLayout.LayoutParams(MATCH_PARENT, dp(3)))

                  val frame = FrameLayout(this)
                  webView = WebView(this).apply { visibility = View.INVISIBLE }
                  setupWebView(webView)
                  frame.addView(webView, FrameLayout.LayoutParams(MATCH_PARENT, MATCH_PARENT))

                  homeView = buildHome()
                  frame.addView(homeView, FrameLayout.LayoutParams(MATCH_PARENT, MATCH_PARENT))

                  fab = TextView(this).apply {
                      textSize = 15f
                      setTextColor(Color.WHITE)
                      setTypeface(typeface, Typeface.BOLD)
                      setPadding(dp(18), dp(12), dp(18), dp(12))
                      background = rounded(blue, 24)
                      elevation = dp(6).toFloat()
                      visibility = View.GONE
                      setOnClickListener { onFabClick() }
                  }
                  frame.addView(fab, FrameLayout.LayoutParams(WRAP_CONTENT, WRAP_CONTENT, Gravity.BOTTOM or Gravity.END).apply {
                      setMargins(dp(16), dp(16), dp(16), dp(16))
                  })
                  page.addView(frame, LinearLayout.LayoutParams(MATCH_PARENT, 0, 1f))
                  updateFab()
                  return page
              }

              private fun buildHome(): View {
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(16), dp(16), dp(16))
                  }
                  box.addView(TextView(this).apply {
                      text = "찬다운로더"
                      textSize = 26f
                      setTypeface(typeface, Typeface.BOLD)
                      setTextColor(blue)
                  })
                  box.addView(TextView(this).apply {
                      text = "사이트에 들어가서 영상을 연 다음, 오른쪽 아래 ⬇ 버튼을 누르세요.\n로그인이 필요한 영상도 여기서 로그인하면 받을 수 있어요."
                      textSize = 13f
                      setTextColor(gray)
                      setPadding(0, dp(4), 0, dp(16))
                  })
                  shortcuts.chunked(3).forEach { rowItems ->
                      val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                      rowItems.forEach { (name, url) ->
                          row.addView(TextView(this).apply {
                              text = name
                              gravity = Gravity.CENTER
                              textSize = 14f
                              setTextColor(blue)
                              setPadding(dp(4), dp(18), dp(4), dp(18))
                              background = rounded(Color.parseColor("#142563EB"), 14)
                              setOnClickListener { loadUrl(url) }
                          }, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f).apply { setMargins(dp(4), dp(4), dp(4), dp(4)) })
                      }
                      repeat(3 - rowItems.size) { row.addView(View(this), LinearLayout.LayoutParams(0, 1, 1f)) }
                      box.addView(row)
                  }
                  return ScrollView(this).apply { addView(box); setBackgroundColor(Color.TRANSPARENT) }
              }

              private fun buildLinkPage(): View {
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(24), dp(20), dp(20))
                  }
                  box.addView(TextView(this).apply {
                      text = "링크로 받기"
                      textSize = 24f
                      setTypeface(typeface, Typeface.BOLD)
                      setTextColor(blue)
                  })
                  box.addView(TextView(this).apply {
                      text = "유튜브·인스타·X·틱톡 등 1000개 이상 사이트 지원\n다른 앱에서 공유 → 찬다운로더 로도 받을 수 있어요."
                      textSize = 13f
                      setTextColor(gray)
                      setPadding(0, dp(2), 0, dp(16))
                  })
                  urlInput = EditText(this).apply {
                      hint = "영상 링크 붙여넣기"
                      textSize = 15f
                      maxLines = 3
                      setPadding(dp(14), dp(14), dp(14), dp(14))
                      background = rounded(Color.parseColor("#1A2563EB"))
                  }
                  box.addView(urlInput, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT))

                  val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setPadding(0, dp(10), 0, 0) }
                  row.addView(button("붙여넣기", false) {
                      val cm = getSystemService(ClipboardManager::class.java)
                      val clip = cm.primaryClip?.getItemAt(0)?.coerceToText(this)?.toString().orEmpty()
                      urlInput.setText(extractUrl(clip) ?: clip)
                  }, LinearLayout.LayoutParams(0, dp(44), 1f))
                  row.addView(View(this), LinearLayout.LayoutParams(dp(10), 1))
                  row.addView(button("지우기", false) { urlInput.setText("") }, LinearLayout.LayoutParams(0, dp(44), 1f))
                  box.addView(row)

                  fun currentUrl(): String? = extractUrl(urlInput.text.toString().trim()).also {
                      if (it == null) Toast.makeText(this, "올바른 링크(http...)를 넣어주세요", Toast.LENGTH_SHORT).show()
                  }

                  box.addView(button("화질 선택해서 다운로드", true) {
                      currentUrl()?.let { showFormatPicker(it, null, null) }
                  }, LinearLayout.LayoutParams(MATCH_PARENT, dp(54)).apply { topMargin = dp(16) })

                  val quick = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setPadding(0, dp(10), 0, 0) }
                  quick.addView(button("⚡ 최고화질 바로", false) {
                      currentUrl()?.let { DownloadManager.enqueue(this, it, null, DownloadManager.BEST_VIDEO); selectTab(TAB_FILES) }
                  }, LinearLayout.LayoutParams(0, dp(46), 1f))
                  quick.addView(View(this), LinearLayout.LayoutParams(dp(10), 1))
                  quick.addView(button("🎵 MP3 바로", false) {
                      currentUrl()?.let { DownloadManager.enqueue(this, it, null, DownloadManager.MP3); selectTab(TAB_FILES) }
                  }, LinearLayout.LayoutParams(0, dp(46), 1f))
                  box.addView(quick)

                  box.addView(button("브라우저에서 열기", false) {
                      currentUrl()?.let { selectTab(TAB_BROWSER); loadUrl(it) }
                  }, LinearLayout.LayoutParams(MATCH_PARENT, dp(46)).apply { topMargin = dp(10) })

                  updateBtn = button("yt-dlp 업데이트 (다운로드가 안 될 때)", false) { updateYtDlp() }
                  box.addView(updateBtn, LinearLayout.LayoutParams(MATCH_PARENT, dp(46)).apply { topMargin = dp(28) })

                  box.addView(TextView(this).apply {
                      text = "저장 위치: 내 파일 → 다운로드 → ${DownloadManager.SAVE_FOLDER}"
                      textSize = 12f
                      setTextColor(gray)
                      gravity = Gravity.CENTER
                      setPadding(0, dp(12), 0, 0)
                  })
                  return ScrollView(this).apply { addView(box) }
              }

              private fun buildFilesPage(): View {
                  val page = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(20), dp(16), 0)
                  }
                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  header.addView(TextView(this).apply {
                      text = "다운로드"
                      textSize = 24f
                      setTypeface(typeface, Typeface.BOLD)
                      setTextColor(blue)
                  }, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))
                  header.addView(TextView(this).apply {
                      text = "기록 지우기"
                      textSize = 14f
                      setTextColor(blue)
                      setPadding(dp(10), dp(8), dp(4), dp(8))
                      setOnClickListener {
                          AlertDialog.Builder(this@MainActivity)
                              .setMessage("완료·실패한 기록을 모두 지울까요?\n(받은 파일은 그대로 남아요)")
                              .setPositiveButton("지우기") { _, _ -> DownloadManager.clearFinished() }
                              .setNegativeButton("취소", null)
                              .show()
                      }
                  })
                  page.addView(header)

                  emptyText = TextView(this).apply {
                      text = "아직 받은 파일이 없어요.\n브라우저나 링크 탭에서 받아보세요."
                      textSize = 14f
                      setTextColor(gray)
                      gravity = Gravity.CENTER
                      setPadding(0, dp(60), 0, 0)
                  }
                  page.addView(emptyText)

                  listBox = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(0, dp(12), 0, dp(12))
                  }
                  page.addView(ScrollView(this).apply { addView(listBox) }, LinearLayout.LayoutParams(MATCH_PARENT, 0, 1f))
                  return page
              }
          }
          EOF_CHAN
          echo '' | base64 -d > app/chan-release.jks

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/ChanDownloader.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ChanDownloader
          path: out/ChanDownloader.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ChanDownloader build ${{ github.run_number }}
          files: out/ChanDownloader.apk
          make_latest: true
