name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate project files
        run: |
          mkdir -p "$(dirname settings.gradle.kts)"
          cat > settings.gradle.kts <<'EOF_CHAN'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ChanDownloader"
          include(":app")
          EOF_CHAN
          mkdir -p "$(dirname build.gradle.kts)"
          cat > build.gradle.kts <<'EOF_CHAN'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF_CHAN
          mkdir -p "$(dirname gradle.properties)"
          cat > gradle.properties <<'EOF_CHAN'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF_CHAN
          mkdir -p "$(dirname app/build.gradle.kts)"
          cat > app/build.gradle.kts <<'EOF_CHAN'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.chan.downloader"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.chan.downloader"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 2
                  versionName = "1.1.0"
                  ndk { abiFilters += listOf("arm64-v8a") }
              }

              signingConfigs {
                  create("release") {
                      val ks = file("chan-release.jks")
                      if (ks.exists()) {
                          storeFile = ks
                          storePassword = System.getenv("KS_PASS") ?: "chan123456"
                          keyAlias = System.getenv("KS_ALIAS") ?: "chan"
                          keyPassword = System.getenv("KS_PASS") ?: "chan123456"
                      }
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      val rel = signingConfigs.getByName("release")
                      signingConfig = if (rel.storeFile != null) rel else signingConfigs.getByName("debug")
                  }
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                      pickFirsts += "**/libc++_shared.so"
                  }
              }

              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("io.github.junkfood02.youtubedl-android:library:0.17.2")
              implementation("io.github.junkfood02.youtubedl-android:ffmpeg:0.17.2")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          EOF_CHAN
          mkdir -p "$(dirname app/src/main/AndroidManifest.xml)"
          cat > app/src/main/AndroidManifest.xml <<'EOF_CHAN'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:name=".App"
                  android:allowBackup="false"
                  android:extractNativeLibs="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="찬다운로더"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|uiMode|density"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <!-- 다른 앱에서 '공유 → 찬다운로더' 로 링크 받기 -->
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".DownloadService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />
              </application>
          </manifest>
          EOF_CHAN
          mkdir -p "$(dirname app/src/main/res/values/themes.xml)"
          cat > app/src/main/res/values/themes.xml <<'EOF_CHAN'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="colorPrimary">#2563EB</item>
                  <item name="colorAccent">#2563EB</item>
                  <item name="android:statusBarColor">#2563EB</item>
              </style>
          </resources>
          EOF_CHAN
          mkdir -p "$(dirname app/src/main/res/drawable/ic_launcher.xml)"
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF_CHAN'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#2563EB" android:pathData="M54,4a50,50 0,1 1,0 100a50,50 0,1 1,0 -100z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M48,26h12v30h12L54,76 36,56h12z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M32,80h44v7H32z"/>
          </vector>
          EOF_CHAN
          mkdir -p "$(dirname app/src/main/java/com/chan/downloader/App.kt)"
          cat > app/src/main/java/com/chan/downloader/App.kt <<'EOF_CHAN'
          package com.chan.downloader

          import android.app.Application
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import com.yausername.ffmpeg.FFmpeg
          import com.yausername.youtubedl_android.YoutubeDL
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Deferred
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.async

          class App : Application() {

              companion object {
                  const val CHANNEL_ID = "download"
                  val appScope = CoroutineScope(SupervisorJob() + Dispatchers.IO)
                  /** yt-dlp + python + ffmpeg 초기화 (첫 실행 때 압축 해제라 몇 초 걸림) */
                  lateinit var initJob: Deferred<Result<Unit>>
              }

              override fun onCreate() {
                  super.onCreate()
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel(CHANNEL_ID, "다운로드", NotificationManager.IMPORTANCE_LOW)
                  )
                  DownloadManager.load(this)
                  initJob = appScope.async {
                      runCatching {
                          YoutubeDL.getInstance().init(this@App)
                          FFmpeg.getInstance().init(this@App)
                      }
                  }
              }
          }
          EOF_CHAN
          mkdir -p "$(dirname app/src/main/java/com/chan/downloader/DownloadManager.kt)"
          cat > app/src/main/java/com/chan/downloader/DownloadManager.kt <<'EOF_CHAN'
          package com.chan.downloader

          import android.content.ContentValues
          import android.content.Context
          import android.net.Uri
          import android.os.Environment
          import android.provider.MediaStore
          import android.webkit.CookieManager
          import android.webkit.MimeTypeMap
          import com.yausername.youtubedl_android.YoutubeDL
          import com.yausername.youtubedl_android.YoutubeDLRequest
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.update
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.sync.Semaphore
          import kotlinx.coroutines.sync.withPermit
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.net.URI

          enum class Status { QUEUED, RUNNING, DONE, FAILED, CANCELED }

          /** 다운로드 옵션 (화질 선택 결과) */
          data class DlOption(
              val label: String,
              val args: List<String>,          // yt-dlp 추가 인자
              val audio: Boolean = false
          )

          data class Task(
              val id: String,
              val url: String,
              val title: String,
              val option: String,
              val status: Status = Status.QUEUED,
              val progress: Int = -1,
              val message: String = "대기 중",
              val fileName: String? = null,
              val uri: String? = null,
              val mime: String? = null,
              val size: Long = 0,
              val time: Long = System.currentTimeMillis()
          ) {
              val active get() = status == Status.QUEUED || status == Status.RUNNING
          }

          object DownloadManager {

              const val SAVE_FOLDER = "ChanDownloader"
              private const val MAX_PARALLEL = 2
              private const val MAX_HISTORY = 300

              private val _tasks = MutableStateFlow<List<Task>>(emptyList())
              val tasks: StateFlow<List<Task>> = _tasks

              private val jobs = HashMap<String, Job>()
              private val semaphore = Semaphore(MAX_PARALLEL)
              private lateinit var app: Context

              // ---------- 프리셋 옵션 ----------
              val BEST_VIDEO = DlOption("최고화질 MP4", listOf("-f", "bv*+ba/b", "-S", "res,ext:mp4:m4a", "--merge-output-format", "mp4"))
              val MP3 = DlOption("MP3 음원", listOf("-x", "--audio-format", "mp3", "--audio-quality", "0"), audio = true)
              val M4A = DlOption("M4A 원본 음원", listOf("-f", "ba[ext=m4a]/ba", "-x", "--audio-format", "m4a"), audio = true)

              fun heightOption(h: Int) = DlOption(
                  "${h}p MP4",
                  listOf("-f", "bv*[height<=$h]+ba/b[height<=$h]/b", "-S", "res,ext:mp4:m4a", "--merge-output-format", "mp4")
              )

              // ---------- 기록 저장 ----------
              fun load(ctx: Context) {
                  app = ctx.applicationContext
                  val raw = app.getSharedPreferences("history", Context.MODE_PRIVATE).getString("items", "[]")
                  val list = runCatching {
                      val arr = JSONArray(raw)
                      (0 until arr.length()).map { i ->
                          val o = arr.getJSONObject(i)
                          Task(
                              id = o.getString("id"),
                              url = o.optString("url"),
                              title = o.optString("title"),
                              option = o.optString("option"),
                              status = runCatching { Status.valueOf(o.optString("status")) }.getOrDefault(Status.FAILED),
                              progress = 100,
                              message = o.optString("message"),
                              fileName = o.optString("fileName").ifEmpty { null },
                              uri = o.optString("uri").ifEmpty { null },
                              mime = o.optString("mime").ifEmpty { null },
                              size = o.optLong("size"),
                              time = o.optLong("time")
                          )
                      }
                  }.getOrDefault(emptyList())
                  _tasks.value = list
              }

              private fun save() {
                  val arr = JSONArray()
                  _tasks.value.filter { !it.active }.take(MAX_HISTORY).forEach { t ->
                      arr.put(JSONObject().apply {
                          put("id", t.id); put("url", t.url); put("title", t.title); put("option", t.option)
                          put("status", t.status.name); put("message", t.message)
                          put("fileName", t.fileName ?: ""); put("uri", t.uri ?: ""); put("mime", t.mime ?: "")
                          put("size", t.size); put("time", t.time)
                      })
                  }
                  app.getSharedPreferences("history", Context.MODE_PRIVATE).edit().putString("items", arr.toString()).apply()
              }

              private fun update(id: String, block: (Task) -> Task) {
                  _tasks.update { list -> list.map { if (it.id == id) block(it) else it } }
              }

              fun hasActive() = _tasks.value.any { it.active }

              // ---------- 다운로드 ----------
              fun enqueue(ctx: Context, url: String, title: String?, option: DlOption, referer: String? = null) {
                  val id = "t" + System.currentTimeMillis() + (0..999).random()
                  val task = Task(id, url, title?.takeIf { it.isNotBlank() } ?: url, option.label)
                  _tasks.update { listOf(task) + it }
                  val cookieFile = writeCookies(url, referer)
                  jobs[id] = App.appScope.launch {
                      semaphore.withPermit { run(task, option, referer, cookieFile) }
                      jobs.remove(id)
                  }
                  DownloadService.ensureRunning(ctx)
              }

              fun cancel(id: String) {
                  runCatching { YoutubeDL.getInstance().destroyProcessById(id) }
                  jobs.remove(id)?.cancel()
                  update(id) { it.copy(status = Status.CANCELED, message = "취소됨") }
                  save()
              }

              fun retry(ctx: Context, t: Task) {
                  remove(t.id, deleteFile = false)
                  val opt = when (t.option) {
                      MP3.label -> MP3
                      M4A.label -> M4A
                      BEST_VIDEO.label -> BEST_VIDEO
                      else -> Regex("""(\d+)p""").find(t.option)?.groupValues?.get(1)?.toIntOrNull()?.let { heightOption(it) } ?: BEST_VIDEO
                  }
                  enqueue(ctx, t.url, t.title, opt)
              }

              fun remove(id: String, deleteFile: Boolean) {
                  val t = _tasks.value.firstOrNull { it.id == id } ?: return
                  if (t.active) cancel(id)
                  if (deleteFile && t.uri != null) runCatching { app.contentResolver.delete(Uri.parse(t.uri), null, null) }
                  _tasks.update { list -> list.filter { it.id != id } }
                  save()
              }

              fun clearFinished() {
                  _tasks.update { list -> list.filter { it.active } }
                  save()
              }

              private suspend fun run(task: Task, option: DlOption, referer: String?, cookieFile: File?) {
                  val id = task.id
                  if (_tasks.value.firstOrNull { it.id == id }?.status == Status.CANCELED) return
                  update(id) { it.copy(status = Status.RUNNING, message = "준비 중...") }

                  val init = App.initJob.await()
                  if (init.isFailure) {
                      fail(id, "초기화 실패: ${init.exceptionOrNull()?.message}"); return
                  }

                  val tmpDir = File(app.cacheDir, "dl_$id").apply { mkdirs() }
                  try {
                      val req = YoutubeDLRequest(task.url).apply {
                          addOption("-o", tmpDir.absolutePath + "/%(title).80B [%(id)s].%(ext)s")
                          addOption("--no-playlist")
                          addOption("--no-mtime")
                          addOption("--windows-filenames")
                          if (referer != null) addOption("--referer", referer)
                          if (cookieFile != null) addOption("--cookies", cookieFile.absolutePath)
                          option.args.forEachIndexed { i, a ->
                              // "-f" 다음 값처럼 짝으로 넣기 위해 순서대로 그대로 추가
                              if (a.startsWith("-")) {
                                  val next = option.args.getOrNull(i + 1)
                                  if (next != null && !next.startsWith("-")) addOption(a, next) else addOption(a)
                              }
                          }
                      }

                      update(id) { it.copy(message = "다운로드 중...") }
                      YoutubeDL.getInstance().execute(req, id) { progress, eta, _ ->
                          val p = progress.toInt().coerceIn(-1, 100)
                          val etaText = if (eta > 0) " · ${formatEta(eta)} 남음" else ""
                          update(id) { it.copy(progress = p, message = "다운로드 중 ${p.coerceAtLeast(0)}%$etaText") }
                      }

                      val files = tmpDir.listFiles()
                          ?.filter { it.isFile && it.length() > 0 && !it.name.endsWith(".part") && !it.name.endsWith(".ytdl") }
                          .orEmpty()
                          .sortedByDescending { it.length() }
                      val main = files.firstOrNull()
                      if (main == null) {
                          fail(id, "받은 파일이 없어요. 지원하지 않는 링크일 수 있어요."); return
                      }
                      update(id) { it.copy(progress = 100, message = "저장 중...") }
                      val (uri, mime) = saveToDownloads(main)
                      val niceTitle = main.nameWithoutExtension.replace(Regex("""\s*\[[^\]]+]$"""), "")
                      update(id) {
                          it.copy(
                              status = Status.DONE, progress = 100, message = "완료",
                              title = niceTitle.ifBlank { it.title }, fileName = main.name,
                              uri = uri.toString(), mime = mime, size = main.length(), time = System.currentTimeMillis()
                          )
                      }
                  } catch (e: YoutubeDL.CanceledException) {
                      update(id) { it.copy(status = Status.CANCELED, message = "취소됨") }
                  } catch (e: kotlinx.coroutines.CancellationException) {
                      update(id) { it.copy(status = Status.CANCELED, message = "취소됨") }
                  } catch (e: Exception) {
                      val msg = e.message?.lines()?.lastOrNull { it.contains("ERROR") }
                          ?: e.message?.lines()?.lastOrNull { it.isNotBlank() } ?: e.toString()
                      fail(id, msg.take(300))
                  } finally {
                      tmpDir.deleteRecursively()
                      cookieFile?.delete()
                      save()
                  }
              }

              private fun fail(id: String, msg: String) {
                  update(id) { it.copy(status = Status.FAILED, message = msg) }
              }

              private fun formatEta(sec: Long): String =
                  if (sec >= 60) "${sec / 60}분 ${sec % 60}초" else "${sec}초"

              /** 앱 브라우저에서 로그인한 쿠키를 yt-dlp 에 넘김 (인스타·페이스북 등 로그인 필요한 영상용) */
              private fun writeCookies(url: String, referer: String?): File? = runCatching {
                  val cm = CookieManager.getInstance()
                  val hosts = listOfNotNull(url, referer).mapNotNull { runCatching { URI(it).host }.getOrNull() }.distinct()
                  val sb = StringBuilder("# Netscape HTTP Cookie File\n")
                  val expiry = System.currentTimeMillis() / 1000 + 365L * 24 * 3600
                  var count = 0
                  for (host in hosts) {
                      val parts = host.split(".")
                      val root = if (parts.size >= 2) parts.takeLast(2).joinToString(".") else host
                      val cookie = cm.getCookie("https://$host") ?: continue
                      cookie.split(";").map { it.trim() }.filter { it.contains("=") }.forEach { kv ->
                          val name = kv.substringBefore("=")
                          val value = kv.substringAfter("=")
                          sb.append(".$root\tTRUE\t/\tTRUE\t$expiry\t$name\t$value\n")
                          count++
                      }
                  }
                  if (count == 0) return null
                  File(app.cacheDir, "cookies_${System.nanoTime()}.txt").apply { writeText(sb.toString()) }
              }.getOrNull()

              /** 앱 캐시 → 공용 다운로드/ChanDownloader 폴더 (권한 필요 없음) */
              private fun saveToDownloads(src: File): Pair<Uri, String> {
                  val ext = src.extension.lowercase()
                  val mime = MimeTypeMap.getSingleton().getMimeTypeFromExtension(ext) ?: "application/octet-stream"
                  val values = ContentValues().apply {
                      put(MediaStore.Downloads.DISPLAY_NAME, src.name)
                      put(MediaStore.Downloads.MIME_TYPE, mime)
                      put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/" + SAVE_FOLDER)
                      put(MediaStore.Downloads.IS_PENDING, 1)
                  }
                  val resolver = app.contentResolver
                  val uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                      ?: throw IllegalStateException("저장 위치를 만들 수 없어요")
                  resolver.openOutputStream(uri)!!.use { out -> src.inputStream().use { it.copyTo(out) } }
                  values.clear()
                  values.put(MediaStore.Downloads.IS_PENDING, 0)
                  resolver.update(uri, values, null, null)
                  return uri to mime
              }
          }
          EOF_CHAN
          mkdir -p "$(dirname app/src/main/java/com/chan/downloader/DownloadService.kt)"
          cat > app/src/main/java/com/chan/downloader/DownloadService.kt <<'EOF_CHAN'
          package com.chan.downloader

          import android.app.Notification
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.IBinder
          import androidx.core.app.NotificationCompat
          import androidx.core.app.NotificationManagerCompat
          import androidx.core.app.ServiceCompat
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.launch

          /** 다운로드가 하나라도 진행 중이면 앱을 나가도 계속 받도록 붙잡아 두는 서비스 */
          class DownloadService : Service() {

              companion object {
                  private const val NOTI_ID = 1
                  private const val DONE_NOTI_ID = 2

                  fun ensureRunning(ctx: Context) {
                      ctx.startForegroundService(Intent(ctx, DownloadService::class.java))
                  }
              }

              private var watcher: Job? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  ServiceCompat.startForeground(
                      this, NOTI_ID, build("준비 중...", -1, 1),
                      ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC
                  )
                  if (watcher?.isActive != true) {
                      watcher = App.appScope.launch {
                          var hadActive = false
                          DownloadManager.tasks.collect { list ->
                              val active = list.filter { it.active }
                              if (active.isEmpty()) {
                                  if (hadActive) notifyDone(list)
                                  ServiceCompat.stopForeground(this@DownloadService, ServiceCompat.STOP_FOREGROUND_REMOVE)
                                  stopSelf()
                                  watcher?.cancel()
                                  return@collect
                              }
                              hadActive = true
                              val first = active.first()
                              val text = if (active.size == 1) first.title else "${active.size}개 받는 중 · ${first.title}"
                              val p = if (active.size == 1) first.progress else active.map { it.progress.coerceAtLeast(0) }.average().toInt()
                              post(NOTI_ID, build(text, p, active.size))
                              kotlinx.coroutines.delay(700)
                          }
                      }
                  }
                  return START_NOT_STICKY
              }

              private fun notifyDone(list: List<Task>) {
                  val last = list.firstOrNull() ?: return
                  val text = when (last.status) {
                      Status.DONE -> "완료: ${last.title}"
                      Status.FAILED -> "실패: ${last.title}"
                      else -> "다운로드가 끝났어요"
                  }
                  post(
                      DONE_NOTI_ID,
                      NotificationCompat.Builder(this, App.CHANNEL_ID)
                          .setSmallIcon(android.R.drawable.stat_sys_download_done)
                          .setContentTitle("찬다운로더")
                          .setContentText(text)
                          .setContentIntent(openApp())
                          .setAutoCancel(true)
                          .build()
                  )
              }

              private fun openApp(): PendingIntent = PendingIntent.getActivity(
                  this, 0,
                  Intent(this, MainActivity::class.java).putExtra(MainActivity.EXTRA_TAB, MainActivity.TAB_FILES),
                  PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
              )

              private fun build(text: String, progress: Int, count: Int): Notification =
                  NotificationCompat.Builder(this, App.CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.stat_sys_download)
                      .setContentTitle(if (count > 1) "찬다운로더 · ${count}개 다운로드 중" else "찬다운로더 · 다운로드 중")
                      .setContentText(text)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setContentIntent(openApp())
                      .setProgress(100, progress.coerceAtLeast(0), progress < 0)
                      .build()

              private fun post(id: Int, n: Notification) {
                  val nm = NotificationManagerCompat.from(this)
                  if (!nm.areNotificationsEnabled()) return
                  runCatching { nm.notify(id, n) }
              }
          }
