              // ==================================================================
              // 브라우저 (여러 탭)

              /** 탭 하나 = WebView 하나 */
              private inner class BrowserTab(val web: WebView) {
                  val detected = LinkedHashSet<String>()
                  var pendingUrl: String? = null   // 복원만 하고 아직 안 연 주소 (탭 열 때 로드)
                  var home = true                   // 시작 화면 상태
                  val url: String get() = if (home) "" else (pendingUrl ?: web.url ?: "")
                  val label: String get() = when {
                      home -> "새 탭"
                      pendingUrl != null -> pendingUrl!!
                      else -> web.title?.takeIf { it.isNotBlank() } ?: web.url ?: "로딩 중"
                  }
              }

              private fun createTab(url: String?, switchTo: Boolean, lazy: Boolean = false): BrowserTab {
                  val tab = BrowserTab(WebView(this))
                  setupWebView(tab)
                  tabs.add(tab)
                  if (url != null && url.isNotBlank()) {
                      tab.home = false
                      if (lazy) tab.pendingUrl = url else tab.web.loadUrl(url)
                  }
                  if (switchTo) switchBrowserTab(tabs.size - 1)
                  updateTabCount()
                  return tab
              }

              private fun switchBrowserTab(i: Int) {
                  if (i !in tabs.indices) return
                  if (::webContainer.isInitialized && curTabIndex in tabs.indices) tabs[curTabIndex].web.onPause()
                  curTabIndex = i
                  val tab = tabs[i]
                  webContainer.removeAllViews()
                  (tab.web.parent as? ViewGroup)?.removeView(tab.web)
                  webContainer.addView(tab.web, FrameLayout.LayoutParams(MATCH_PARENT, MATCH_PARENT))
                  tab.web.onResume()
                  tab.pendingUrl?.let { tab.pendingUrl = null; tab.web.loadUrl(it) }
                  homeView.visibility = if (tab.home) View.VISIBLE else View.GONE
                  tab.web.visibility = if (tab.home) View.INVISIBLE else View.VISIBLE
                  addressBar.setText(if (tab.home) "" else tab.web.url ?: "")
                  pageProgress.visibility = View.INVISIBLE
                  updateFab()
                  updateTabCount()
                  saveTabs()
              }

              private fun closeBrowserTab(i: Int) {
                  if (i !in tabs.indices) return
                  val tab = tabs.removeAt(i)
                  (tab.web.parent as? ViewGroup)?.removeView(tab.web)
                  tab.web.stopLoading()
                  tab.web.destroy()
                  if (tabs.isEmpty()) {
                      createTab(null, switchTo = true)
                      return
                  }
                  val next = when {
                      i < curTabIndex -> curTabIndex - 1
                      i == curTabIndex -> (i - 1).coerceAtLeast(0)
                      else -> curTabIndex
                  }
                  curTabIndex = -1
                  switchBrowserTab(next.coerceIn(0, tabs.size - 1))
              }

              private fun updateTabCount() {
                  if (::tabCountView.isInitialized) tabCountView.text = tabs.size.toString()
              }

              /** 탭 주소 저장 — 앱을 껐다 켜도 그대로 */
              private fun saveTabs() {
                  if (tabs.isEmpty()) return
                  val arr = org.json.JSONArray()
                  tabs.forEach { arr.put(it.url) }
                  getSharedPreferences("app", Context.MODE_PRIVATE).edit()
                      .putString("tabs", arr.toString())
                      .putInt("tabIndex", curTabIndex.coerceAtLeast(0))
                      .apply()
              }

              private fun restoreTabs() {
                  val prefs = getSharedPreferences("app", Context.MODE_PRIVATE)
                  val urls = runCatching {
                      val arr = org.json.JSONArray(prefs.getString("tabs", "[]"))
                      (0 until arr.length()).map { arr.getString(it) }
                  }.getOrDefault(emptyList())
                  if (urls.isEmpty()) {
                      createTab(null, switchTo = true)
                      return
                  }
                  urls.forEach { createTab(it, switchTo = false, lazy = true) }
                  switchBrowserTab(prefs.getInt("tabIndex", 0).coerceIn(0, tabs.size - 1))
              }

              private fun showTabSwitcher() {
                  lateinit var dialog: AlertDialog
                  val list = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(12), dp(8), dp(12), dp(8))
                  }
                  fun render() {
                      list.removeAllViews()
                      tabs.forEachIndexed { i, tab ->
                          val row = LinearLayout(this).apply {
                              orientation = LinearLayout.HORIZONTAL
                              gravity = Gravity.CENTER_VERTICAL
                              setPadding(dp(12), dp(4), dp(4), dp(4))
                              background = rounded(
                                  if (i == curTabIndex) Color.parseColor("#262563EB") else Color.parseColor("#0F888888"), 12
                              )
                          }
                          row.addView(TextView(this).apply {
                              text = (if (i == curTabIndex) "▶ " else "") + tab.label
                              textSize = 14f
                              maxLines = 2
                              ellipsize = TextUtils.TruncateAt.END
                              setPadding(0, dp(10), dp(8), dp(10))
                              setOnClickListener { switchBrowserTab(i); dialog.dismiss() }
                          }, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))
                          row.addView(TextView(this).apply {
                              text = "✕"
                              textSize = 18f
                              setTextColor(gray)
                              setPadding(dp(14), dp(10), dp(14), dp(10))
                              setOnClickListener { closeBrowserTab(i); render() }
                          })
                          list.addView(row, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply { bottomMargin = dp(6) })
                      }
                  }
                  render()
                  dialog = AlertDialog.Builder(this)
                      .setTitle("탭 ${tabs.size}개")
                      .setView(ScrollView(this).apply { addView(list) })
                      .setPositiveButton("＋ 새 탭") { _, _ -> createTab(null, switchTo = true) }
                      .setNeutralButton("모두 닫기") { _, _ ->
                          while (tabs.size > 1) closeBrowserTab(tabs.size - 1)
                          closeBrowserTab(0)
                      }
                      .setNegativeButton("닫기", null)
                      .show()
              }

              private fun loadUrl(input: String) {
                  val t = input.trim()
                  if (t.isEmpty()) return
                  val url = when {
                      t.startsWith("http://") || t.startsWith("https://") -> t
                      t.contains(".") && !t.contains(" ") -> "https://$t"
                      else -> "https://www.google.com/search?q=" + Uri.encode(t)
                  }
                  if (tabs.isEmpty()) createTab(null, switchTo = true)
                  val tab = tabs[curTabIndex]
                  tab.home = false
                  tab.pendingUrl = null
                  homeView.visibility = View.GONE
                  tab.web.visibility = View.VISIBLE
                  tab.web.loadUrl(url)
                  hideKeyboard()
                  updateFab()
                  saveTabs()
              }

              private fun showHome() {
                  val tab = tabs.getOrNull(curTabIndex) ?: return
                  tab.home = true
                  homeView.visibility = View.VISIBLE
                  tab.web.visibility = View.INVISIBLE
                  addressBar.setText("")
                  synchronized(tab.detected) { tab.detected.clear() }
                  updateFab()
                  saveTabs()
              }

              private fun updateFab() {
                  if (!::fabBox.isInitialized) return
                  val tab = tabs.getOrNull(curTabIndex)
                  val n = tab?.let { synchronized(it.detected) { it.detected.size } } ?: 0
                  fabBadge.text = n.toString()
                  fabBadge.visibility = if (n > 0) View.VISIBLE else View.GONE
                  fabBox.visibility = if (tab == null || tab.home) View.GONE else View.VISIBLE
              }

              private fun onFabClick() {
                  val tab = tabs.getOrNull(curTabIndex) ?: return
                  if (tab.home) {
                      Toast.makeText(this, "먼저 영상이 있는 페이지를 열어주세요", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val pageUrl = tab.web.url ?: return
                  val pageTitle = tab.web.title
                  val media = synchronized(tab.detected) { tab.detected.toList() }.reversed()
                  if (media.isEmpty()) {
                      showFormatPicker(pageUrl, null, pageTitle)
                      return
                  }
                  val items = (listOf("🔍 이 페이지 분석해서 받기 (추천)") +
                      media.map { "🎬 " + it.substringBefore("?").substringAfterLast("/").ifBlank { it }.take(60) })
                      .toTypedArray<CharSequence>()
                  AlertDialog.Builder(this)
                      .setTitle("무엇을 받을까요?")
                      .setItems(items) { _, which ->
                          if (which == 0) showFormatPicker(pageUrl, null, pageTitle)
                          else {
                              DownloadManager.enqueue(this, media[which - 1], pageTitle, DownloadManager.BEST_VIDEO, pageUrl)
                              Toast.makeText(this, "다운로드를 시작했어요", Toast.LENGTH_SHORT).show()
                              selectTab(TAB_FILES)
                          }
                      }
                      .setNegativeButton("취소", null)
                      .show()
              }

              @SuppressLint("SetJavaScriptEnabled")
              private fun setupWebView(tab: BrowserTab) {
                  val w = tab.web
                  w.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      loadWithOverviewMode = true
                      useWideViewPort = true
                      setSupportZoom(true)
                      builtInZoomControls = true
                      displayZoomControls = false
                      mediaPlaybackRequiresUserGesture = true
                      setSupportMultipleWindows(true)        // 새 창(target=_blank) → 새 탭
                      javaScriptCanOpenWindowsAutomatically = false
                  }
                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(w, true)

                  fun isCurrent() = tabs.getOrNull(curTabIndex) === tab

                  w.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                          val s = request.url.scheme ?: return false
                          if (s == "http" || s == "https" || s == "about" || s == "blob" || s == "data") return false
                          return true   // intent:// 등 앱 링크는 무시
                      }

                      override fun onPageStarted(view: WebView, url: String, favicon: Bitmap?) {
                          synchronized(tab.detected) { tab.detected.clear() }
                          if (isCurrent()) { addressBar.setText(url); updateFab() }
                      }

                      override fun doUpdateVisitedHistory(view: WebView, url: String, isReload: Boolean) {
                          if (isCurrent() && !addressBar.hasFocus()) addressBar.setText(url)
                          saveTabs()
                      }

                      override fun shouldInterceptRequest(view: WebView, request: WebResourceRequest): WebResourceResponse? {
                          val u = request.url.toString()
                          if (mediaRegex.containsMatchIn(u)) {
                              val added = synchronized(tab.detected) { tab.detected.add(u) }
                              if (added) runOnUiThread { if (isCurrent()) updateFab() }
                          }
                          return null
                      }
                  }
                  w.webChromeClient = object : WebChromeClient() {
                      override fun onProgressChanged(view: WebView, newProgress: Int) {
                          if (!isCurrent()) return
                          pageProgress.progress = newProgress
                          pageProgress.visibility = if (newProgress in 1..99) View.VISIBLE else View.INVISIBLE
                      }

                      override fun onCreateWindow(view: WebView, isDialog: Boolean, isUserGesture: Boolean, resultMsg: android.os.Message): Boolean {
                          if (!isUserGesture) return false      // 자동 팝업(광고)은 막기
                          val newTab = createTab(null, switchTo = false)
                          newTab.home = false
                          switchBrowserTab(tabs.indexOf(newTab))
                          val transport = resultMsg.obj as WebView.WebViewTransport
                          transport.webView = newTab.web
                          resultMsg.sendToTarget()
                          Toast.makeText(this@MainActivity, "새 탭에서 열었어요 (탭 ${tabs.size}개)", Toast.LENGTH_SHORT).show()
                          return true
                      }

                      override fun onCloseWindow(window: WebView) {
                          val i = tabs.indexOfFirst { it.web === window }
                          if (i >= 0) closeBrowserTab(i)
                      }
                  }
              }

              // ==================================================================
              // 옮길 수 있는 다운로드 버튼 (드래그로 위치 이동, 위치 기억)
              @SuppressLint("ClickableViewAccessibility")
              private fun makeDraggable(v: View) {
                  val prefs = getSharedPreferences("app", Context.MODE_PRIVATE)
                  v.translationX = prefs.getFloat("fabX", 0f)
                  v.translationY = prefs.getFloat("fabY", 0f)
                  var downX = 0f; var downY = 0f; var startTx = 0f; var startTy = 0f; var dragging = false
                  val slop = dp(8)
                  v.setOnTouchListener { view, e ->
                      when (e.actionMasked) {
                          android.view.MotionEvent.ACTION_DOWN -> {
                              downX = e.rawX; downY = e.rawY; startTx = view.translationX; startTy = view.translationY
                              dragging = false; true
                          }
                          android.view.MotionEvent.ACTION_MOVE -> {
                              val dx = e.rawX - downX; val dy = e.rawY - downY
                              if (!dragging && (kotlin.math.abs(dx) > slop || kotlin.math.abs(dy) > slop)) dragging = true
                              if (dragging) {
                                  val parent = view.parent as View
                                  // 기본 위치(오른쪽 아래) 기준으로 화면 밖으로 안 나가게
                                  val minX = -(parent.width - view.width - dp(32)).toFloat()
                                  val minY = -(parent.height - view.height - dp(32)).toFloat()
                                  view.translationX = (startTx + dx).coerceIn(minX, 0f)
                                  view.translationY = (startTy + dy).coerceIn(minY, 0f)
                              }
                              true
                          }
                          android.view.MotionEvent.ACTION_UP -> {
                              if (dragging) {
                                  prefs.edit().putFloat("fabX", view.translationX).putFloat("fabY", view.translationY).apply()
                              } else view.performClick()
                              true
                          }
                          else -> true
                      }
                  }
              }

