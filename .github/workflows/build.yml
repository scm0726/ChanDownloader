                  }, LinearLayout.LayoutParams(0, dp(46), 1f))
                  box.addView(quick)

                  box.addView(button("브라우저에서 열기", false) {
                      currentUrl()?.let { selectTab(TAB_BROWSER); loadUrl(it) }
                  }, LinearLayout.LayoutParams(MATCH_PARENT, dp(46)).apply { topMargin = dp(10) })

                  box.addView(CheckBox(this).apply {
                      text = "⚡ 고속 다운로드 (파일을 16개 연결로 나눠 받기)"
                      textSize = 14f
                      isChecked = DownloadManager.fastMode
                      setOnCheckedChangeListener { _, c -> DownloadManager.fastMode = c }
                  }, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply { topMargin = dp(20) })

                  box.addView(button("🔋 백그라운드 다운로드 허용 (배터리 제한 없음)", false) {
                      askBatteryExemption(force = true)
                  }, LinearLayout.LayoutParams(MATCH_PARENT, dp(46)).apply { topMargin = dp(8) })

                  updateBtn = button("yt-dlp 업데이트 (다운로드가 안 될 때)", false) { updateYtDlp() }
                  box.addView(updateBtn, LinearLayout.LayoutParams(MATCH_PARENT, dp(46)).apply { topMargin = dp(10) })

                  box.addView(TextView(this).apply {
                      text = "저장 위치: 내 파일 → 다운로드 → ${DownloadManager.SAVE_FOLDER}"
                      textSize = 12f
                      setTextColor(gray)
                      gravity = Gravity.CENTER
                      setPadding(0, dp(12), 0, 0)
                  })
                  return ScrollView(this).apply { addView(box) }
              }

              private fun buildFilesPage(): View {
                  val page = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(20), dp(16), 0)
                  }
                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  header.addView(TextView(this).apply {
                      text = "다운로드"
                      textSize = 24f
                      setTypeface(typeface, Typeface.BOLD)
                      setTextColor(blue)
                  }, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))
                  header.addView(TextView(this).apply {
                      text = "기록 지우기"
                      textSize = 14f
                      setTextColor(blue)
                      setPadding(dp(10), dp(8), dp(4), dp(8))
                      setOnClickListener {
                          AlertDialog.Builder(this@MainActivity)
                              .setMessage("완료·실패한 기록을 모두 지울까요?\n(받은 파일은 그대로 남아요)")
                              .setPositiveButton("지우기") { _, _ -> DownloadManager.clearFinished() }
                              .setNegativeButton("취소", null)
                              .show()
                      }
                  })
                  page.addView(header)

                  emptyText = TextView(this).apply {
                      text = "아직 받은 파일이 없어요.\n브라우저나 링크 탭에서 받아보세요."
                      textSize = 14f
                      setTextColor(gray)
                      gravity = Gravity.CENTER
                      setPadding(0, dp(60), 0, 0)
                  }
                  page.addView(emptyText)

                  listBox = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(0, dp(12), 0, dp(12))
                  }
                  page.addView(ScrollView(this).apply { addView(listBox) }, LinearLayout.LayoutParams(MATCH_PARENT, 0, 1f))
                  return page
              }
          }
          EOF_CHAN
          echo '' | base64 -d > app/chan-release.jks

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/ChanDownloader.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ChanDownloader
          path: out/ChanDownloader.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ChanDownloader build ${{ github.run_number }}
          files: out/ChanDownloader.apk
          make_latest: true
