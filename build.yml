name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate project files
        run: |
          mkdir -p "$(dirname settings.gradle.kts)"
          cat > settings.gradle.kts <<'EOF_CHAN'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ChanDownloader"
          include(":app")
          EOF_CHAN
          mkdir -p "$(dirname build.gradle.kts)"
          cat > build.gradle.kts <<'EOF_CHAN'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF_CHAN
          mkdir -p "$(dirname gradle.properties)"
          cat > gradle.properties <<'EOF_CHAN'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF_CHAN
          mkdir -p "$(dirname app/build.gradle.kts)"
          cat > app/build.gradle.kts <<'EOF_CHAN'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.chan.downloader"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.chan.downloader"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
                  ndk { abiFilters += listOf("arm64-v8a") }
              }

              signingConfigs {
                  create("release") {
                      val ks = file("chan-release.jks")
                      if (ks.exists()) {
                          storeFile = ks
                          storePassword = System.getenv("KS_PASS") ?: "chan123456"
                          keyAlias = System.getenv("KS_ALIAS") ?: "chan"
                          keyPassword = System.getenv("KS_PASS") ?: "chan123456"
                      }
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      val rel = signingConfigs.getByName("release")
                      signingConfig = if (rel.storeFile != null) rel else signingConfigs.getByName("debug")
                  }
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                      pickFirsts += "**/libc++_shared.so"
                  }
              }

              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("io.github.junkfood02.youtubedl-android:library:0.17.2")
              implementation("io.github.junkfood02.youtubedl-android:ffmpeg:0.17.2")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          EOF_CHAN
          mkdir -p "$(dirname app/src/main/AndroidManifest.xml)"
          cat > app/src/main/AndroidManifest.xml <<'EOF_CHAN'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:name=".App"
                  android:allowBackup="false"
                  android:extractNativeLibs="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="찬다운로더"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <!-- 다른 앱에서 '공유 → 찬다운로더' 로 링크 받기 -->
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".DownloadService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />
              </application>
          </manifest>
          EOF_CHAN
          mkdir -p "$(dirname app/src/main/res/values/themes.xml)"
          cat > app/src/main/res/values/themes.xml <<'EOF_CHAN'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="colorPrimary">#2563EB</item>
                  <item name="colorAccent">#2563EB</item>
                  <item name="android:statusBarColor">#2563EB</item>
              </style>
          </resources>
          EOF_CHAN
          mkdir -p "$(dirname app/src/main/res/drawable/ic_launcher.xml)"
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF_CHAN'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#2563EB" android:pathData="M54,4a50,50 0,1 1,0 100a50,50 0,1 1,0 -100z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M48,26h12v30h12L54,76 36,56h12z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M32,80h44v7H32z"/>
          </vector>
          EOF_CHAN
          mkdir -p "$(dirname app/src/main/java/com/chan/downloader/App.kt)"
          cat > app/src/main/java/com/chan/downloader/App.kt <<'EOF_CHAN'
          package com.chan.downloader

          import android.app.Application
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import com.yausername.ffmpeg.FFmpeg
          import com.yausername.youtubedl_android.YoutubeDL
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Deferred
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.async

          class App : Application() {

              companion object {
                  const val CHANNEL_ID = "download"
                  val appScope = CoroutineScope(SupervisorJob() + Dispatchers.IO)
                  /** yt-dlp + python + ffmpeg 초기화 (첫 실행 때 압축 해제라 몇 초 걸림) */
                  lateinit var initJob: Deferred<Result<Unit>>
              }

              override fun onCreate() {
                  super.onCreate()
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel(CHANNEL_ID, "다운로드", NotificationManager.IMPORTANCE_LOW)
                  )
                  initJob = appScope.async {
                      runCatching {
                          YoutubeDL.getInstance().init(this@App)
                          FFmpeg.getInstance().init(this@App)
                      }
                  }
              }
          }
          EOF_CHAN
          mkdir -p "$(dirname app/src/main/java/com/chan/downloader/DownloadState.kt)"
          cat > app/src/main/java/com/chan/downloader/DownloadState.kt <<'EOF_CHAN'
          package com.chan.downloader

          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.update

          data class UiState(
              val running: Boolean = false,
              val progress: Int = 0,          // 0~100, -1 = 진행률 모름
              val status: String = "링크를 붙여넣거나, 다른 앱에서 공유 → 찬다운로더 를 눌러주세요.",
              val log: String = ""
          )

          object DownloadState {
              private val _state = MutableStateFlow(UiState())
              val state: StateFlow<UiState> = _state

              fun set(block: (UiState) -> UiState) = _state.update(block)

              fun log(line: String) = _state.update {
                  val lines = (it.log + "\n" + line).trim().lines().takeLast(80)
                  it.copy(log = lines.joinToString("\n"))
              }
          }
          EOF_CHAN
          mkdir -p "$(dirname app/src/main/java/com/chan/downloader/DownloadService.kt)"
          cat > app/src/main/java/com/chan/downloader/DownloadService.kt <<'EOF_CHAN'
          package com.chan.downloader

          import android.app.Notification
          import android.app.PendingIntent
          import android.app.Service
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Environment
          import android.os.IBinder
          import android.provider.MediaStore
          import android.webkit.MimeTypeMap
          import androidx.core.app.NotificationCompat
          import androidx.core.app.NotificationManagerCompat
          import androidx.core.app.ServiceCompat
          import com.yausername.youtubedl_android.YoutubeDL
          import com.yausername.youtubedl_android.YoutubeDLRequest
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.launch
          import java.io.File

          class DownloadService : Service() {

              companion object {
                  const val EXTRA_URL = "url"
                  const val EXTRA_AUDIO = "audio"
                  const val ACTION_CANCEL = "com.chan.downloader.CANCEL"
                  private const val PROCESS_ID = "chan_dl"
                  private const val NOTI_ID = 1
                  const val SAVE_FOLDER = "ChanDownloader"

                  fun start(ctx: Context, url: String, audioOnly: Boolean) {
                      val i = Intent(ctx, DownloadService::class.java)
                          .putExtra(EXTRA_URL, url)
                          .putExtra(EXTRA_AUDIO, audioOnly)
                      ctx.startForegroundService(i)
                  }

                  fun cancel(ctx: Context) {
                      ctx.startService(Intent(ctx, DownloadService::class.java).setAction(ACTION_CANCEL))
                  }
              }

              private var job: Job? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_CANCEL) {
                      runCatching { YoutubeDL.getInstance().destroyProcessById(PROCESS_ID) }
                      job?.cancel()
                      DownloadState.set { it.copy(running = false, progress = 0, status = "취소했어요.") }
                      stopSelfSafely()
                      return START_NOT_STICKY
                  }

                  // startForegroundService 로 시작됐으면 반드시 먼저 포그라운드로 전환
                  ServiceCompat.startForeground(
                      this, NOTI_ID, buildNotification("준비 중...", -1),
                      ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC
                  )

                  val url = intent?.getStringExtra(EXTRA_URL)
                  if (job?.isActive == true) return START_NOT_STICKY
                  if (url.isNullOrBlank()) {
                      stopSelfSafely()
                      return START_NOT_STICKY
                  }
                  val audioOnly = intent?.getBooleanExtra(EXTRA_AUDIO, false) ?: false

                  job = App.appScope.launch { runDownload(url, audioOnly) }
                  return START_NOT_STICKY
              }

              private suspend fun runDownload(url: String, audioOnly: Boolean) {
                  DownloadState.set { it.copy(running = true, progress = -1, status = "준비 중...", log = "") }
                  DownloadState.log("▶ $url")

                  val init = App.initJob.await()
                  if (init.isFailure) {
                      finish("초기화 실패: ${init.exceptionOrNull()?.message}")
                      return
                  }

                  val tmpDir = File(cacheDir, "dl_${System.currentTimeMillis()}").apply { mkdirs() }
                  try {
                      val req = YoutubeDLRequest(url).apply {
                          addOption("-o", tmpDir.absolutePath + "/%(title).80B [%(id)s].%(ext)s")
                          addOption("--no-playlist")
                          addOption("--no-mtime")
                          addOption("--windows-filenames")
                          if (audioOnly) {
                              addOption("-x")
                              addOption("--audio-format", "mp3")
                              addOption("--audio-quality", "0")
                          } else {
                              addOption("-f", "bv*+ba/b")
                              addOption("-S", "res,ext:mp4:m4a")
                              addOption("--merge-output-format", "mp4")
                          }
                      }

                      DownloadState.set { it.copy(status = "다운로드 중...") }
                      var lastNoti = 0L
                      YoutubeDL.getInstance().execute(req, PROCESS_ID) { progress, eta, line ->
                          val p = progress.toInt().coerceIn(-1, 100)
                          val etaText = if (eta > 0) " · 남은 시간 ${eta}초" else ""
                          DownloadState.set { it.copy(progress = p, status = "다운로드 중 ${p.coerceAtLeast(0)}%$etaText") }
                          if (line.isNotBlank()) DownloadState.log(line)
                          val now = System.currentTimeMillis()
                          if (now - lastNoti > 700) {
                              lastNoti = now
                              notify("다운로드 중 ${p.coerceAtLeast(0)}%$etaText", p)
                          }
                      }

                      val files = tmpDir.listFiles()?.filter { it.isFile && it.length() > 0 && !it.name.endsWith(".part") }.orEmpty()
                      if (files.isEmpty()) {
                          finish("받은 파일이 없어요. 지원하지 않는 링크일 수 있어요.")
                          return
                      }
                      DownloadState.set { it.copy(progress = 100, status = "저장 중...") }
                      val saved = files.map { saveToDownloads(it) }
                      finish("완료! 다운로드/$SAVE_FOLDER 폴더에 저장했어요.\n" + saved.joinToString("\n"))
                  } catch (e: YoutubeDL.CanceledException) {
                      finish("취소했어요.")
                  } catch (e: Exception) {
                      val msg = e.message?.lines()?.lastOrNull { it.isNotBlank() } ?: e.toString()
                      DownloadState.log(e.message ?: e.toString())
                      finish("실패: $msg\n(안 되면 아래 'yt-dlp 업데이트'를 눌러보세요)")
                  } finally {
                      tmpDir.deleteRecursively()
                  }
              }

              /** 앱 캐시 → 공용 다운로드/ChanDownloader 폴더 (권한 필요 없음) */
              private fun saveToDownloads(src: File): String {
                  val ext = src.extension.lowercase()
                  val mime = MimeTypeMap.getSingleton().getMimeTypeFromExtension(ext) ?: "application/octet-stream"
                  val values = ContentValues().apply {
                      put(MediaStore.Downloads.DISPLAY_NAME, src.name)
                      put(MediaStore.Downloads.MIME_TYPE, mime)
                      put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/" + SAVE_FOLDER)
                      put(MediaStore.Downloads.IS_PENDING, 1)
                  }
                  val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                      ?: throw IllegalStateException("저장 위치를 만들 수 없어요")
                  contentResolver.openOutputStream(uri)!!.use { out -> src.inputStream().use { it.copyTo(out) } }
                  values.clear()
                  values.put(MediaStore.Downloads.IS_PENDING, 0)
                  contentResolver.update(uri, values, null, null)
                  return src.name
              }

              private fun finish(message: String) {
                  DownloadState.set { it.copy(running = false, status = message, progress = if (message.startsWith("완료")) 100 else 0) }
                  DownloadState.log(message)
                  ServiceCompat.stopForeground(this, ServiceCompat.STOP_FOREGROUND_REMOVE)
                  if (NotificationManagerCompat.from(this).areNotificationsEnabled()) {
                      runCatching {
                          NotificationManagerCompat.from(this).notify(
                              NOTI_ID + 1,
                              NotificationCompat.Builder(this, App.CHANNEL_ID)
                                  .setSmallIcon(android.R.drawable.stat_sys_download_done)
                                  .setContentTitle("찬다운로더")
                                  .setContentText(message.lines().first())
                                  .setContentIntent(openAppIntent())
                                  .setAutoCancel(true)
                                  .build()
                          )
                      }
                  }
                  stopSelf()
              }

              private fun stopSelfSafely() {
                  ServiceCompat.stopForeground(this, ServiceCompat.STOP_FOREGROUND_REMOVE)
                  stopSelf()
              }

              private fun openAppIntent(): PendingIntent = PendingIntent.getActivity(
                  this, 0, Intent(this, MainActivity::class.java),
                  PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
              )

              private fun buildNotification(text: String, progress: Int): Notification {
                  val cancelPi = PendingIntent.getService(
                      this, 1, Intent(this, DownloadService::class.java).setAction(ACTION_CANCEL),
                      PendingIntent.FLAG_IMMUTABLE
                  )
                  return NotificationCompat.Builder(this, App.CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.stat_sys_download)
                      .setContentTitle("찬다운로더")
                      .setContentText(text)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setContentIntent(openAppIntent())
                      .setProgress(100, progress.coerceAtLeast(0), progress < 0)
                      .addAction(0, "취소", cancelPi)
                      .build()
              }

              private fun notify(text: String, progress: Int) {
                  if (!NotificationManagerCompat.from(this).areNotificationsEnabled()) return
                  runCatching { NotificationManagerCompat.from(this).notify(NOTI_ID, buildNotification(text, progress)) }
              }
          }
          EOF_CHAN
          mkdir -p "$(dirname app/src/main/java/com/chan/downloader/MainActivity.kt)"
          cat > app/src/main/java/com/chan/downloader/MainActivity.kt <<'EOF_CHAN'
          package com.chan.downloader

          import android.Manifest
          import android.content.ClipboardManager
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup.LayoutParams.MATCH_PARENT
          import android.view.ViewGroup.LayoutParams.WRAP_CONTENT
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.RadioButton
          import android.widget.RadioGroup
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import androidx.lifecycle.Lifecycle
          import androidx.lifecycle.lifecycleScope
          import androidx.lifecycle.repeatOnLifecycle
          import com.yausername.youtubedl_android.YoutubeDL
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext

          class MainActivity : AppCompatActivity() {

              private lateinit var urlInput: EditText
              private lateinit var audioRadio: RadioButton
              private lateinit var downloadBtn: Button
              private lateinit var cancelBtn: Button
              private lateinit var progress: ProgressBar
              private lateinit var statusText: TextView
              private lateinit var logText: TextView
              private lateinit var updateBtn: Button

              private val blue = Color.parseColor("#2563EB")

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(buildUi())

                  if (Build.VERSION.SDK_INT >= 33 &&
                      ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 10)
                  }

                  lifecycleScope.launch {
                      repeatOnLifecycle(Lifecycle.State.STARTED) {
                          DownloadState.state.collect { s ->
                              statusText.text = s.status
                              logText.text = s.log
                              downloadBtn.isEnabled = !s.running
                              downloadBtn.alpha = if (s.running) 0.5f else 1f
                              cancelBtn.visibility = if (s.running) View.VISIBLE else View.GONE
                              progress.visibility = if (s.running || s.progress == 100) View.VISIBLE else View.INVISIBLE
                              progress.isIndeterminate = s.running && s.progress < 0
                              if (s.progress >= 0) progress.progress = s.progress
                          }
                      }
                  }

                  handleShare(intent)
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  handleShare(intent)
              }

              /** 유튜브·인스타 등에서 '공유 → 찬다운로더' 로 들어오면 바로 다운로드 시작 */
              private fun handleShare(intent: Intent?) {
                  if (intent?.action != Intent.ACTION_SEND) return
                  val text = intent.getStringExtra(Intent.EXTRA_TEXT) ?: return
                  val url = extractUrl(text) ?: return
                  urlInput.setText(url)
                  intent.action = null
                  startDownload()
              }

              private fun extractUrl(text: String): String? =
                  Regex("""https?://\S+""").find(text)?.value?.trimEnd('.', ',', ')', ']', '"', '\'')

              private fun startDownload() {
                  val url = extractUrl(urlInput.text.toString().trim())
                  if (url == null) {
                      Toast.makeText(this, "올바른 링크(http...)를 넣어주세요", Toast.LENGTH_SHORT).show()
                      return
                  }
                  DownloadService.start(this, url, audioRadio.isChecked)
              }

              private fun updateYtDlp() {
                  updateBtn.isEnabled = false
                  updateBtn.text = "업데이트 중..."
                  lifecycleScope.launch {
                      val msg = withContext(Dispatchers.IO) {
                          runCatching {
                              App.initJob.await().getOrThrow()
                              val st = YoutubeDL.getInstance().updateYoutubeDL(applicationContext)
                              val ver = YoutubeDL.getInstance().versionName(applicationContext) ?: "?"
                              if (st == YoutubeDL.UpdateStatus.DONE) "yt-dlp 업데이트 완료 ($ver)" else "이미 최신이에요 ($ver)"
                          }.getOrElse { "업데이트 실패: ${it.message}" }
                      }
                      Toast.makeText(this@MainActivity, msg, Toast.LENGTH_LONG).show()
                      updateBtn.isEnabled = true
                      updateBtn.text = "yt-dlp 업데이트 (다운로드가 안 될 때)"
                  }
              }

              // ---------------- UI (코드로 구성) ----------------

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun rounded(color: Int, radius: Int = 14, stroke: Int? = null) = GradientDrawable().apply {
                  setColor(color); cornerRadius = dp(radius).toFloat()
                  if (stroke != null) setStroke(dp(1), stroke)
              }

              private fun button(text: String, primary: Boolean, onClick: () -> Unit) = Button(this).apply {
                  this.text = text
                  isAllCaps = false
                  textSize = if (primary) 17f else 14f
                  setTextColor(if (primary) Color.WHITE else blue)
                  background = if (primary) rounded(blue) else rounded(Color.TRANSPARENT, stroke = blue)
                  stateListAnimator = null
                  setOnClickListener { onClick() }
              }

              private fun buildUi(): View {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(24), dp(20), dp(20))
                  }

                  root.addView(TextView(this).apply {
                      text = "찬다운로더"
                      textSize = 26f
                      setTypeface(typeface, Typeface.BOLD)
                      setTextColor(blue)
                  })
                  root.addView(TextView(this).apply {
                      text = "광고 없음 · 유튜브, 인스타, X, 페이스북, 틱톡 등 지원"
                      textSize = 13f
                      alpha = 0.7f
                      setPadding(0, dp(2), 0, dp(18))
                  })

                  urlInput = EditText(this).apply {
                      hint = "영상 링크 붙여넣기"
                      textSize = 15f
                      maxLines = 3
                      setPadding(dp(14), dp(14), dp(14), dp(14))
                      background = rounded(Color.parseColor("#1A2563EB"))
                  }
                  root.addView(urlInput, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT))

                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(0, dp(10), 0, 0)
                  }
                  val lp = LinearLayout.LayoutParams(0, dp(44), 1f)
                  row.addView(button("붙여넣기", false) {
                      val cm = getSystemService(ClipboardManager::class.java)
                      val clip = cm.primaryClip?.getItemAt(0)?.coerceToText(this)?.toString().orEmpty()
                      urlInput.setText(extractUrl(clip) ?: clip)
                  }, lp)
                  row.addView(View(this), LinearLayout.LayoutParams(dp(10), 1))
                  row.addView(button("지우기", false) { urlInput.setText("") }, lp)
                  root.addView(row)

                  val group = RadioGroup(this).apply {
                      orientation = RadioGroup.HORIZONTAL
                      setPadding(0, dp(14), 0, dp(6))
                  }
                  val videoRadio = RadioButton(this).apply { text = "영상 (최고화질 MP4)"; id = View.generateViewId() }
                  audioRadio = RadioButton(this).apply { text = "음원만 (MP3)"; id = View.generateViewId() }
                  group.addView(videoRadio)
                  group.addView(audioRadio)
                  group.check(videoRadio.id)
                  root.addView(group)

                  downloadBtn = button("다운로드", true) { startDownload() }
                  root.addView(downloadBtn, LinearLayout.LayoutParams(MATCH_PARENT, dp(56)).apply { topMargin = dp(6) })

                  progress = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply {
                      max = 100
                      visibility = View.INVISIBLE
                  }
                  root.addView(progress, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply { topMargin = dp(14) })

                  statusText = TextView(this).apply {
                      textSize = 14f
                      setPadding(0, dp(6), 0, dp(6))
                  }
                  root.addView(statusText)

                  cancelBtn = button("취소", false) { DownloadService.cancel(this) }.apply { visibility = View.GONE }
                  root.addView(cancelBtn, LinearLayout.LayoutParams(MATCH_PARENT, dp(44)))

                  logText = TextView(this).apply {
                      textSize = 11f
                      typeface = Typeface.MONOSPACE
                      alpha = 0.6f
                      setPadding(dp(10), dp(10), dp(10), dp(10))
                      background = rounded(Color.parseColor("#14000000"), 10)
                  }
                  val logScroll = ScrollView(this).apply { addView(logText) }
                  root.addView(logScroll, LinearLayout.LayoutParams(MATCH_PARENT, 0, 1f).apply { topMargin = dp(10) })

                  updateBtn = button("yt-dlp 업데이트 (다운로드가 안 될 때)", false) { updateYtDlp() }
                  root.addView(updateBtn, LinearLayout.LayoutParams(MATCH_PARENT, dp(44)).apply { topMargin = dp(10) })

                  root.addView(TextView(this).apply {
                      text = "저장 위치: 내 파일 → 다운로드 → ${DownloadService.SAVE_FOLDER}"
                      textSize = 12f
                      alpha = 0.6f
                      gravity = Gravity.CENTER
                      setPadding(0, dp(8), 0, 0)
                  })

                  return root
              }
          }
          EOF_CHAN
          echo '' | base64 -d > app/chan-release.jks

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/ChanDownloader.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ChanDownloader
          path: out/ChanDownloader.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ChanDownloader build ${{ github.run_number }}
          files: out/ChanDownloader.apk
          make_latest: true
